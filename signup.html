<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/HClogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Learning Sign Up</title>
    <style>
        :root {
            --kids-blue: #BEE0E3;      
            --kids-dark: #1a4046;      
            --kids-accent: #0a92aab4;    
            --gray-light: #f9fafb;     
            --gray-medium: #d1d5db;    
        }

        body {
            background-color: var(--kids-blue);
            font-family: 'Inter', sans-serif;
            color: var(--kids-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            margin: 0;
        }

        .main-container {
            width: 100%;
            max-width: 1280px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding-top: 0rem;
            margin-top: 0;
            
        }

        @media (min-width: 1024px) {
            body {
                padding: 2rem;
            }
            .main-container {
                flex-direction: row; 
            }
            .left-panel {
                padding-right: 3rem;
                width: 50%;
            }
            .signup-card-container {
                width: 50%;
            }
        }

        .welcome-logo-row {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-top: 0;
            transform: scale(1.2);
        }

        .title-welcome {
            font-size: 3rem;
            font-weight: 800;
            margin-top: 0;
            line-height: 1;
            margin-bottom: 0;
        }

        .signup-card-container {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-top: 0;
        }

        .signup-card {
            box-shadow: 12px 12px 0 0 rgba(0, 0, 0, 0.9); 
            border: 4px solid var(--kids-dark); 
            max-width: 400px;
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .signup-title {
            font-size: 1.875rem;
            font-weight: 800;
            margin-bottom: 2rem;
            text-transform: uppercase;
            text-align: center;
        }

        .input-group {
            margin-bottom: 1.0rem;
            position: relative;
        }

        .input-group-icon {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            display: flex;
            align-items: center;
            padding-left: 0.75rem;
            pointer-events: none;
        }

        .input-group .label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            display: block;
            letter-spacing: 0.3px;
        }


        .input-group input {
            background-color: var(--gray-light);
            border: 2px solid var(--gray-medium);
            color: var(--kids-dark);
            border-radius: 0.75rem;
            display: block;
            width: 90%;
            font-size: 1rem;         
            padding: 0.5rem 1rem 0.5rem 2rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            border-color: var(--kids-accent);
            box-shadow: 0 0 0 4px rgba(0, 184, 217, 0.25);
            outline: none;
        }

        .signup-button {
            width: 100%;
            color: white;
            background-color: var(--kids-accent);
            font-weight: 800;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            padding: 0.75rem 1.25rem;
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.25s ease, opacity .2s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            margin-bottom: 1rem;
            border: none;
            cursor: pointer;
        }

        .signup-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.18);
        }

        .signup-button:active {
            transform: translateY(1px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .signup-button:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(0, 184, 217, 0.35);
        }

        .message-box {
            text-align: center;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            transition: height 0.3s, opacity 0.3s;
            max-height: 0;
            overflow: hidden;
        }

        .message-error {
            color: #b91c1c;
            background: #ffe5e5;
            border-left: 4px solid #ef4444;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.1);
            max-height: 100px;
        }

        .message-success {
            color: #166534;
            background: #e7fce8;
            border-left: 4px solid #22c55e;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.1);
            max-height: 100px;
        }


        .link-group {
            text-align: center;
            font-size: 0.875rem;
        }

        .login-link {
            color: var(--kids-accent);
            font-weight: 800;
            text-decoration: underline;
            transition: color 0.2s;
            cursor: pointer;
        }

        .login-link:hover {
            color: var(--kids-dark);
        }

        .logo-image {
            height: 10rem;
            width: auto;
            display: block;
        }

        .activity-img {
            width: 130%;
            height: 130%;
            object-fit: contain;
            border-radius: 0.5rem;
            margin-top: 2rem; 
        }

        .peeking-kids-img {
            position: absolute;
            left: 43rem;
            top: 50%;
            transform: translateY(-45%);
            z-index: 0;
            opacity: 0.9;
            border-radius: 0.5rem;
            width: 450px;
        }

        .hidden-on-mobile {
            display: none;
        }

        @media (min-width: 1024px) {
            .hidden-on-mobile {
                display: block;
            }
        }

        .password-requirements {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: -0.8rem;
            margin-bottom: 1rem;
            padding-left: 0.5rem;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="left-panel">
            <div class="welcome-logo-row">
                <img src="/assets/HClogo.png" alt="Kids App Logo" class="logo-image">
                                <h1 class="title-welcome">JOIN US NOW!</h1>
            </div>

            <div style="width: 130%; height: 400px;  border-radius: 1rem; margin-top: 2rem; display: flex; align-items: center; justify-content: center; color: var(--kids-dark); font-weight: 700;">
                <img src="/assets/preview.png" alt="Preview" width="400px">
            </div>
        </div>

        <div class="signup-card-container">
            
            <div class="signup-card">
                <h2 class="signup-title">CREATE ACCOUNT</h2>
                <form id="signup-form">

                    <h3>Child's Info</h3>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- child name icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <input type="text" id="child-username" placeholder="  Child's Name" required>
            </div>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- date of birth icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <input type="text" id="child-dob" placeholder="  Child's Date of Birth" onfocus="this.type='date'" required>
            </div>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- password icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V9a2 2 0 014 0v2"></path>
                    </svg>
                </div>
                <input type="password" id="child-password" placeholder="  Child's Password" required>
            </div>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- password icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V9a2 2 0 014 0v2"></path>
                    </svg>
                </div>
                <input type="password" id="child-confirm-password" placeholder="  Confirm Child's Password" required>
            </div>
            <!-- PARENT'S INFO -->
            <h3>Parent's Info</h3>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- parent username icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <input type="text" id="parent-username" placeholder="  Parent's Username" required>
            </div>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- parent password icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V9a2 2 0 014 0v2"></path>
                    </svg>
                </div>
                <input type="password" id="parent-password" placeholder="  Parent's Password" required>
            </div>

            <div class="input-group">
                <div class="input-group-icon">
                    <!-- parent confirm password icon -->
                    <svg width="20" height="20" fill="none" stroke="#333" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 11V9a2 2 0 014 0v2"></path>
                    </svg>
                </div>
                <input type="password" id="parent-confirm-password" placeholder="  Confirm Parent's Password" required>
            </div>

            <button type="submit" class="signup-button">Sign Up</button>

            <div id="message-box" class="message-box"></div>

            <div class="link-group">
                <p>Already have an account? <a href="login.html" class="login-link">Click to login</a></p>
            </div>

        </form>
    </div>
</div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const messageBox = document.getElementById('message-box');

            messageBox.textContent = '';
            messageBox.classList.remove('message-error', 'message-success');

            // Validation
            if (!username || !email || !password || !confirmPassword) {
                showMessage('All fields are required!', 'error');
                return;
            }
            
            if (username.length < 3) {
                showMessage('Username must be at least 3 characters long.', 'error');
                return;
            }

            // Basic email validation
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                showMessage('Please enter a valid email address.', 'error');
                return;
            }

            const dob = document.getElementById('dob').value;

            if (!dob) {
                showMessage('Please enter your date of birth.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Passwords do not match!', 'error');
                return;
            }

            console.log(`Creating account with Username: ${username}, Email: ${email}`);
            showMessage('Account created successfully! Redirecting to login...', 'success');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500); 
        });

        // Navigate to login page
        document.getElementById('login-link').addEventListener('click', function(event) {
            event.preventDefault();
            alert('In a real app, you would be redirected to the login page now!');
        });

        function showMessage(message, type) {
            const messageBox = document.getElementById('message-box');
            messageBox.textContent = message;

            if (type === 'success') {
                messageBox.classList.add('message-success');
            } else { 
                messageBox.classList.add('message-error');
            }
        }
    </script>
</body>
</html>
