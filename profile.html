<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<link rel="icon" type="image/png" href="/assets/HClogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <!-- Logo outside container -->
    <div class="dashboard-logo">
        <a href="dashboard.html" title="Go to Home">
        <img src="/assets/HClogo.png" alt="Kids App Logo" class="logo-top-left">
        </a>
    </div>

    <div class="container">
        <!-- Avatar -->
        <div class="avatar-wrapper">
            <img src="/assets/girlAvatar.png" alt="Avatar" class="avatar">
        </div>

        <!-- Name as Image -->
        <img src="assets/name.png" alt="Child Name" class="name-image">

        <!-- Options -->
        <div class="options">
    <button onclick="changeFont()" class="option-btn">
        <img src="/assets/icons/font.png" class="option-icon" width="28px" height="28px">
        Change Font
    </button>

    <button onclick="playFidgetSpinner()" class="option-btn">
        <img src="/assets/icons/fidget.png" class="option-icon" width="28px" height="28px">
        Fidget Spinner
    </button>

    <button onclick="editAvatar()" class="option-btn">
        <img src="/assets/icons/edit.webp" class="option-icon" width="28px" height="28px">
        Edit my Avatar
    </button>

    <!--<button onclick="playFidgetSpinner()" class="option-btn">
        <img src="/assets/icons/spinner.png" class="option-icon" width="28px" height="28px">
        Try Fidget Spinner
    </button>-->

    <button onclick="logout()" class="option-btn">
        <img src="/assets/icons/logout.webp" class="option-icon" width="28px" height="28px">
        Logout
    </button>
</div>

       
    </div>

    <script src="profile.js"></script>
</body>
</html>
